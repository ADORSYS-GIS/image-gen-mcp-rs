[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.95
allow = [
    "OpenSSL",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "MIT",
    "Apache-2.0",
    "EUPL-1.2",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "PostgreSQL",
    "BSD-2-Clause",
    "Unlicense"
]

[advisories]
ignore = [
]

[bans]
skip = [
]