[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.95
allow = [
    "OpenSSL",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "MIT",
    "Apache-2.0",
    "EUPL-1.2",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "PostgreSQL",
    "BSD-2-Clause",
    "Unlicense"
]

[advisories]
ignore = [
    # RUSTSEC-2024-0436: paste is unmaintained (not vulnerable). Transitive via
    # image -> ravif -> rav1e (AV1 encoder, build-time proc-macro only).
    # No safe upgrade exists upstream; revisit when the  crate stack drops rav1e/paste.
    "RUSTSEC-2024-0436",
]

[bans]
skip = [
]