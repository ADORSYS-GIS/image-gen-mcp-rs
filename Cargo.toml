[package]
name = "image-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for image generation/editing via OpenAI-compatible endpoints (nanobanana, gpt-image-gen)"
license = "MIT"
repository = "https://github.com/ADORSYS-GIS/image-gen-mcp-rs"
authors = [
    "Stephane Segning <selastlambou@gmail.com>",
    "adorsys GIS <gis-udm@adorsys.com>",
]

[dependencies]
# MCP SDK - supports stdio + streamable HTTP + SSE
# 1.0 note: the HTTP server itself moved to the standalone rust-mcp-axum crate
# (hyper-server feature was removed in 0.10.0); sse/streamable-http remain here
# as transport-layer features.
rust-mcp-sdk = { version = "1.0", default-features = false, features = [
    "server",
    "macros",
    "stdio",
    "streamable-http",
    "sse",
] }

# Axum-based MCP HTTP server integration (required since rust-mcp-sdk 0.10)
rust-mcp-axum = { version = "1.0", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# High-performance allocator
mimalloc = "0.1"

# OpenAI-compatible API client for image generation
async-openai = { version = "0.41", default-features = false, features = [
    "rustls",
    "_api",
    "image",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async utilities
async-trait = "0.1"

# HTTP client for API calls
# multipart/json declared explicitly: we call reqwest::multipart + .json() ourselves
# (previously relied on transitive feature-unification via async-openai)
# 0.13 renamed the rustls-tls feature to rustls
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "json"] }

# CLI arguments with environment variable support
clap = { version = "4", features = ["derive", "env"] }

# CUID2 for unique identifiers (never use UUID)
cuid2 = "0.1"

# Base64 decoding
base64 = "0.23"

# Image processing for format conversion
image = "0.25"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
incremental = false
strip = true
